# Phala Cloud deployment manifest for the ETHesis agent runtime.
#
# Paste this into the Phala Cloud "Create CVM → Custom Compose" UI
# (or pass via CLI). The image must be available at a public registry
# (Docker Hub or ghcr.io). Replace `your-dockerhub-user` below with
# whatever you pushed.
#
# After deploy, Phala provides:
#   - A public app URL (we don't need it; the agent has no inbound HTTP)
#   - A TDX attestation endpoint (auto-generated)
#   - Live logs in the Phala Cloud dashboard
#
# All env vars come from Phala's encrypted-secrets feature — set them in
# the Cloud UI before deploy.

services:
  ethesis-agent:
    image: your-dockerhub-user/ethesis-agent:latest
    restart: always
    environment:
      # Required
      DATABASE_URL: ${DATABASE_URL}
      AGENT_MASTER_SEED: ${AGENT_MASTER_SEED}

      # Optional (each falls back to mock mode if unset)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PINATA_JWT: ${PINATA_JWT}

      # Apify x402 path
      X402_ENABLED: ${X402_ENABLED}
      APIFY_X402_ACTOR: ${APIFY_X402_ACTOR}
      X402_NETWORK: ${X402_NETWORK}

      # Apify token path (alternative to x402)
      APIFY_TOKEN: ${APIFY_TOKEN}
      APIFY_ACTOR_ID_OUTPUT_WATCHER: ${APIFY_ACTOR_ID_OUTPUT_WATCHER}

      # ENS writer (writes attestation CIDs to ENS text records)
      PLATFORM_ENS_NAME: ${PLATFORM_ENS_NAME}
      PLATFORM_ENS_OWNER_PRIVATE_KEY: ${PLATFORM_ENS_OWNER_PRIVATE_KEY}
      PLATFORM_ENS_CHAIN: ${PLATFORM_ENS_CHAIN}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}

      # SpaceComputer cTRNG (optional — without creds, falls back to IPFS beacon)
      ORBITPORT_CLIENT_ID: ${ORBITPORT_CLIENT_ID}
      ORBITPORT_CLIENT_SECRET: ${ORBITPORT_CLIENT_SECRET}

    # Phala mounts the DStack socket here automatically.
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock

    # Resource hints — adjust to your Phala plan
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
